plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

android {
    namespace "org.wtron.app"
    compileSdk 35

    defaultConfig {
        applicationId "org.wtron.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def storeFilePath = localProperties.getProperty("WTRON_RELEASE_STORE_FILE") ?: System.getenv("WTRON_RELEASE_STORE_FILE")
            def storePasswordValue = localProperties.getProperty("WTRON_RELEASE_STORE_PASSWORD") ?: System.getenv("WTRON_RELEASE_STORE_PASSWORD")
            def keyAliasValue = localProperties.getProperty("WTRON_RELEASE_KEY_ALIAS") ?: System.getenv("WTRON_RELEASE_KEY_ALIAS")
            def keyPasswordValue = localProperties.getProperty("WTRON_RELEASE_KEY_PASSWORD") ?: System.getenv("WTRON_RELEASE_KEY_PASSWORD")
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
}
